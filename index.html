<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="styles.css?v=1.0.0">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="300x300">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
  <div id="img-popup" class="img-popup" onclick="closePopup()">
  <img id="popup-img" src="" alt="">
</div>
  <header class="appbar app-header">

  <!-- Colonne gauche : sélecteur de bâtiment -->
  <div class="header-side header-left">

    <div class="service-switcher">

      <button id="service-switch-btn"
              class="service-chip service-cardio"
              type="button">

        <span id="service-chip-icon" class="service-icon">♡</span>

        <span id="service-chip-label">
          Institut de cardiologie
        </span>

        <span class="service-arrow">▾</span>

      </button>

      <div id="service-menu"
           class="service-menu hidden">

        <button data-service="cardio">
          <span class="service-menu-icon">♡</span>
          Institut de cardiologie
        </button>

        <button data-service="gaston">
          <span class="service-menu-icon">⚕</span>
          Gaston Cordier
        </button>

        <button data-service="husson">
          <span class="service-menu-icon">⌁</span>
          Husson Mourier
        </button>

        <button data-service="babinski">
          <span class="service-menu-icon">☊</span>
          Babinski
        </button>

      </div>

    </div>

  </div>

  <!-- Centre -->
  <div class="header-text">
    <div class="header-title">
      Protocoles d'anesthésie-réanimation
    </div>
    <div class="header-subtitle">
      Groupe hospitalier Pitié-Salpêtrière
    </div>
  </div>

  <!-- Colonne droite : accès rapide + recherche -->
  <div class="header-side header-right">

    <div class="home-qa-wrap header-qa-wrap">
      <button id="home-qa-btn"
              type="button"
              class="btn qa-btn">
        Accès rapide ▾
      </button>

      <div id="home-qa-menu"
           class="qa-menu">
      </div>
    </div>

    <div class="home-search-wrap header-search">
      <input id="home-search"
             type="search"
             placeholder="Recherche..."
             autocomplete="off">

      <div id="home-search-panel"
           class="search-panel">
      </div>
    </div>

  </div>

</header>

  <main class="container">
    <div id="app"></div>
  </main>

<footer id="app-footer">
  <div class="theme-switcher">
    <span>Thème :</span>
    <label>
      <input type="radio" name="theme" id="theme-dark" value="dark">
      Sombre
    </label>
    <label>
      <input type="radio" name="theme" id="theme-light" value="light">
      Clair
    </label>
  </div>
<button id="saricnews-logo"
        class="footer-actus-btn"
        type="button"
        onclick="openActus()"
        aria-label="Actualités">
  <img src="img/saricnews.png" alt="SARIC News">
</button>
  <div class="footer-actions">
    <button id="back-button" class="back-btn">Retour</button>
  </div>
</footer>

<!-- PDF.js (viewer multi-pages) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  (function () {
    const pdfjs = window.pdfjsLib || globalThis.pdfjsLib;
    if (pdfjs) {
      pdfjs.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    } else {
      console.warn("pdfjsLib introuvable après chargement pdf.min.js (cdnjs)");
    }
  })();
</script>

  
<!-- Application -->
<script src="./launcher.js?v=1.0.0"></script>
  
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js", { scope: "./" })
          .then(reg => console.log("✅ Service Worker enregistré :", reg.scope))
          .catch(err => console.error("❌ Erreur SW :", err));
      });
    }
  </script>
</body>
</html>
